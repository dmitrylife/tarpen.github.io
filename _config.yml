title: Tarpen
description: Общественный архив состояния территории
url: "https://www.tarpen.ru"
baseurl: ""

lang: ru
timezone: Europe/Kaliningrad

# Public feedback form. Paste the full Formspree endpoint here,
# for example: https://formspree.io/f/xxxxxxxx
formspree_endpoint: "https://formspree.io/f/xjyvqolk"

collections:
  cases:
    output: true
    permalink: /cases/:name/

defaults:
  - scope:
      path: ""
      type: cases
    values:
      layout: case

exclude:
  - README.md
  - MANUAL.md
  - LICENSE
  - vendor
  - Gemfile
  - Gemfile.lock
