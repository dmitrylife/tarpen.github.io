{% assign current_url = page.url | default: '/' %}
{% assign cases_active = false %}
{% if page.collection == 'cases' %}{% assign cases_active = true %}{% endif %}

<header>
  <a class="brand" href="/" aria-label="Tarpen — главная">
    <img class="brand-mark" src="/favicon.svg" width="44" height="44" alt="" aria-hidden="true">
    <span class="brand-copy">
      <span class="brand-title">Tarpen</span>
      <span class="brand-subtitle">
        общественный архив состояния территории
      </span>
    </span>
  </a>

  <nav aria-label="Основная навигация">
    <a href="/"{% if current_url == '/' %} class="active" aria-current="page"{% endif %}>Главная</a>
    <a href="/places/"{% if current_url contains '/places/' or cases_active %} class="active" aria-current="page"{% endif %}>Территории</a>
    <a href="/documents.html"{% if current_url == '/documents.html' %} class="active" aria-current="page"{% endif %}>Документы</a>
    <a href="/photos.html"{% if current_url == '/photos.html' %} class="active" aria-current="page"{% endif %}>Фото и видео</a>
    <a href="/responses.html"{% if current_url == '/responses.html' %} class="active" aria-current="page"{% endif %}>Ответы</a>
    <a href="/contact.html"{% if current_url == '/contact.html' %} class="active" aria-current="page"{% endif %}>Сообщить о проблеме</a>
  </nav>
</header>
