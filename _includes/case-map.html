<div class="case-map-shell">
  <div id="case-map" class="case-map" aria-label="Карта опубликованных кейсов по территории"></div>
  <noscript>
    <p class="section-note">Для отображения интерактивной карты требуется JavaScript.</p>
  </noscript>
</div>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQ3yn5pJsK5wSaN7uZ1QjMZbV6H2fM="
      crossorigin="">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script>
(() => {
  const mapElement = document.getElementById('case-map');
  if (!mapElement || typeof L === 'undefined') return;

  const cases = [
    {% assign sorted_cases = site.cases | sort: "classification.order" %}
    {% for case in sorted_cases %}
      {% if case.location.settlement == include.settlement and case.location.coordinates %}
      {
        title: {{ case.title | jsonify }},
        url: {{ case.url | relative_url | jsonify }},
        status: {{ case.case_status.label | jsonify }},
        statusCode: {{ case.case_status.code | jsonify }},
        lat: {{ case.location.coordinates.lat | jsonify }},
        lon: {{ case.location.coordinates.lon | jsonify }}
      },
      {% endif %}
    {% endfor %}
  ];

  if (!cases.length) {
    mapElement.hidden = true;
    return;
  }

  const map = L.map(mapElement, {
    scrollWheelZoom: false,
    touchZoom: false,
    doubleClickZoom: false,
    boxZoom: false,
    keyboard: false,
    dragging: true,
    zoomControl: true
  });

  // Leaflet can re-enable handlers in some environments/plugins; keep
  // page scrolling independent from the map unless the user taps +/-.
  map.scrollWheelZoom.disable();
  map.touchZoom.disable();
  map.doubleClickZoom.disable();

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const bounds = [];

  cases.forEach((item) => {
    const marker = L.circleMarker([item.lat, item.lon], {
      radius: 8,
      weight: 2,
      color: '#38462f',
      fillColor: item.statusCode === 'resolved' ? '#5f6f52' : item.statusCode === 'monitoring' ? '#8a6b3d' : '#9a5b35',
      fillOpacity: 0.9
    }).addTo(map);

    const popup = document.createElement('div');
    popup.className = 'map-popup';

    const status = document.createElement('div');
    status.className = 'map-popup-status';
    status.textContent = item.status;

    const title = document.createElement('strong');
    title.textContent = item.title;

    const link = document.createElement('a');
    link.href = item.url;
    link.textContent = 'Открыть кейс';

    popup.append(status, title, link);
    marker.bindPopup(popup);
    bounds.push([item.lat, item.lon]);
  });

  if (bounds.length === 1) {
    map.setView(bounds[0], 16);
  } else {
    map.fitBounds(bounds, { padding: [38, 38], maxZoom: 16 });
  }
})();
</script>
